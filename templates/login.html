<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Data Tracker Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f6fa;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .login-panel {
            width: min(420px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            padding: 28px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            letter-spacing: 0;
        }
        p {
            margin: 0 0 22px;
            color: #526173;
            font-size: 14px;
            line-height: 1.45;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 16px;
        }
        button {
            width: 100%;
            height: 44px;
            margin-top: 16px;
            border: 0;
            border-radius: 6px;
            background: #0f2a4a;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin: 14px 0 0;
            color: #b91c1c;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <h1>Macro Data Tracker</h1>
        <p>Enter the dashboard password to continue.</p>
        <form method="post">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
            <button type="submit">Unlock Dashboard</button>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
        </form>
    </main>
</body>
</html>
