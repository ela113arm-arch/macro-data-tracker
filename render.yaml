services:
  - type: web
    name: macro-data-tracker
    env: docker
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRED_API_KEY
        sync: false
      - key: BEA_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
